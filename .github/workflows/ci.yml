name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          ENABLE_MARKET_PRICE_LOOKUP: "false"
          ENABLE_QUALITY_SCORING: "false"
          ENABLE_PRE_SEND_REVIEW: "false"
          LIVE_GIFT_VALUE_LOOKUP: "false"
          MIN_SAVINGS: "100"
        run: python -m unittest discover -s tests
