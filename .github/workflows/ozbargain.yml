name: OzBargain Monitor

on:
  schedule:
    # GitHub cron is UTC-only. These two entries cover 7:17 PM Australia/Sydney:
    # - 09:17 UTC during AEST (UTC+10)
    # - 08:17 UTC during AEDT (UTC+11)
    # The first step gates by TZ=Australia/Sydney so only the correct one runs.
    - cron: '17 8 * * *'
    - cron: '17 9 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: ozbargain-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Sydney schedule window
        id: schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sydney_hour="$(TZ=Australia/Sydney date +%H)"
          sydney_time="$(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M %Z')"
          echo "Sydney time: $sydney_time"

          if [ "$sydney_hour" = "19" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip outside Sydney 7 PM
        if: steps.schedule_gate.outputs.should_run != 'true'
        run: echo "Skipping because this UTC cron entry is outside the 7 PM Australia/Sydney window."

      - uses: actions/checkout@v4
        if: steps.schedule_gate.outputs.should_run == 'true'

      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.should_run == 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: python -m unittest discover -s tests

      - name: Write Google credentials
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}'        > token.json

      - name: Run monitor
        if: steps.schedule_gate.outputs.should_run == 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          GMAIL_CC:           ${{ secrets.GMAIL_CC }}
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          TOKEN_FILE:         token.json
          CREDENTIALS_FILE:   credentials.json
          MIN_SAVINGS:        "200"
          OZB_MAX_PAGES:      "200"
          ENABLE_MARKET_PRICE_LOOKUP: "false"
          ENABLE_QUALITY_SCORING: "false"
          ENABLE_PRE_SEND_REVIEW: "false"
        run: python ozbargain_monitor.py
