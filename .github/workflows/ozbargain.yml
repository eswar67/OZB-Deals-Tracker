name: OzBargain Monitor

on:
  schedule:
    # GitHub cron is UTC-only and scheduled events can be delayed or dropped.
    # Wake frequently across both AEST/AEDT afternoon/evening windows; the
    # Sydney-time gate + cache below sends each slot only once per day.
    # AEST:  2:00 PM = 04:00 UTC, 7:15 PM = 09:15 UTC
    # AEDT:  2:00 PM = 03:00 UTC, 7:15 PM = 08:15 UTC
    - cron: '*/15 3-10 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: ozbargain-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Sydney schedule window
        id: schedule_gate
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          sydney_date="$(TZ=Australia/Sydney date +%Y%m%d)"
          sydney_hour="$(TZ=Australia/Sydney date +%H)"
          sydney_minute="$(TZ=Australia/Sydney date +%M)"
          sydney_time="$(TZ=Australia/Sydney date '+%Y-%m-%d %H:%M %Z')"
          sydney_minutes=$((10#$sydney_hour * 60 + 10#$sydney_minute))

          echo "Sydney time: $sydney_time"
          echo "Sydney minutes since midnight: $sydney_minutes"

          # GitHub can delay or skip individual scheduled events. Because this
          # workflow wakes repeatedly, run the first due slot that has not been
          # marked sent by the cache. Late GitHub delivery still catches up.
          if (( sydney_minutes >= 14 * 60 && sydney_minutes < 19 * 60 + 15 )); then
            echo "slot_key=${sydney_date}-afternoon" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif (( sydney_minutes >= 19 * 60 + 15 )); then
            echo "slot_key=${sydney_date}-evening" >> "$GITHUB_OUTPUT"
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip outside Sydney 2:00 PM / 7:15 PM
        if: steps.schedule_gate.outputs.should_run != 'true'
        run: echo "Skipping because this UTC cron entry is outside the 2:00 PM / 7:15 PM Australia/Sydney windows."

      - name: Restore schedule slot marker
        id: schedule_cache
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .schedule-cache-marker
          key: ozbargain-monitor-${{ steps.schedule_gate.outputs.slot_key }}

      - name: Skip duplicate scheduled slot
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'schedule' && steps.schedule_cache.outputs.cache-hit == 'true'
        run: echo "Report already sent for this Sydney schedule slot."

      - uses: actions/checkout@v4
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.schedule_cache.outputs.cache-hit != 'true'

      - name: Check published site slot marker
        id: site_slot
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'schedule' && steps.schedule_cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          sydney_now = datetime.now(ZoneInfo("Australia/Sydney"))
          current_minutes = sydney_now.hour * 60 + sydney_now.minute
          current_slot = "afternoon" if current_minutes < 19 * 60 + 15 else "evening"

          text = Path("docs/index.html").read_text(errors="ignore") if Path("docs/index.html").exists() else ""
          match = re.search(r"Latest run:\s*(\d{2}\s+\w{3}\s+\d{4},\s+\d{1,2}:\d{2}\s+[AP]M)", text)
          if not match:
              print("handled=false")
              raise SystemExit

          latest = datetime.strptime(match.group(1), "%d %b %Y, %I:%M %p").replace(tzinfo=ZoneInfo("Australia/Sydney"))
          latest_minutes = latest.hour * 60 + latest.minute
          latest_slot = "afternoon" if 14 * 60 <= latest_minutes < 19 * 60 + 15 else "evening"
          handled = latest.date() == sydney_now.date() and latest_slot == current_slot
          print(f"handled={'true' if handled else 'false'}")
          print(f"latest_site_run={latest.isoformat()}")
          print(f"current_slot={current_slot}")
          PY

      - name: Skip slot already published by Mac fallback
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'schedule' && steps.site_slot.outputs.handled == 'true'
        run: echo "Published site already shows this Sydney slot was handled by fallback."

      - uses: actions/setup-python@v5
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.schedule_cache.outputs.cache-hit != 'true' && steps.site_slot.outputs.handled != 'true'
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.schedule_cache.outputs.cache-hit != 'true' && steps.site_slot.outputs.handled != 'true'
        run: pip install -r requirements.txt

      - name: Run tests
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.schedule_cache.outputs.cache-hit != 'true' && steps.site_slot.outputs.handled != 'true'
        run: python -m unittest discover -s tests

      - name: Write Google credentials
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.schedule_cache.outputs.cache-hit != 'true' && steps.site_slot.outputs.handled != 'true'
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}'        > token.json

      - name: Run monitor
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.schedule_cache.outputs.cache-hit != 'true' && steps.site_slot.outputs.handled != 'true'
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          GMAIL_CC:           ${{ secrets.GMAIL_CC }}
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          TOKEN_FILE:         token.json
          CREDENTIALS_FILE:   credentials.json
          MIN_SAVINGS:        "200"
          OZB_MAX_PAGES:      "200"
          ENABLE_MARKET_PRICE_LOOKUP: "false"
          ENABLE_QUALITY_SCORING: "false"
          ENABLE_PRE_SEND_REVIEW: "false"
          ENABLE_SITE_AUTO_PUBLISH: "false"
        run: python ozbargain_monitor.py

      - name: Mark scheduled slot sent
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'schedule' && steps.schedule_cache.outputs.cache-hit != 'true' && (steps.site_slot.outputs.handled == 'true' || success())
        run: |
          mkdir -p .schedule-cache-marker
          echo "${{ steps.schedule_gate.outputs.slot_key }}" > .schedule-cache-marker/slot.txt

      - name: Save schedule slot marker
        if: steps.schedule_gate.outputs.should_run == 'true' && github.event_name == 'schedule' && steps.schedule_cache.outputs.cache-hit != 'true' && (steps.site_slot.outputs.handled == 'true' || success())
        uses: actions/cache/save@v4
        with:
          path: .schedule-cache-marker
          key: ozbargain-monitor-${{ steps.schedule_gate.outputs.slot_key }}
