name: OzBargain Monitor

on:
  schedule:
    # 7:17 PM AEST = 09:17 UTC. Non-zero minute avoids peak GitHub cron delays.
    # During AEDT this runs at 8:17 PM local; GitHub cron is UTC-only.
    - cron: '17 9 * * *'
  workflow_dispatch:   # allow manual trigger from GitHub UI

permissions:
  contents: read

concurrency:
  group: ozbargain-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Write Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN }}'        > token.json

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_TO:           ${{ secrets.GMAIL_TO }}
          SEATS_AERO_API_KEY: ${{ secrets.SEATS_AERO_API_KEY }}
          TOKEN_FILE:         token.json
          CREDENTIALS_FILE:   credentials.json
          MIN_SAVINGS:        200
          OZB_MAX_PAGES:      200
          ENABLE_MARKET_PRICE_LOOKUP: false
          ENABLE_QUALITY_SCORING: false
          ENABLE_PRE_SEND_REVIEW: false
        run: python ozbargain_monitor.py
