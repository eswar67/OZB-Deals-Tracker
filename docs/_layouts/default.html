<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <script>document.documentElement.dataset.theme=(function(){try{return localStorage.getItem('ozb-theme')||'dark'}catch(e){return 'dark'}})();</script>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}?v={{ site.github.build_revision | default: site.time | date: '%s' }}">
</head>
<body>
  <main class="site-shell">
    {{ content }}
  </main>
</body>
</html>
